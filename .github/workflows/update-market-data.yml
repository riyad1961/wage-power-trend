name: Update market data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest market values
        run: node scripts/update-market-data.mjs

      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- latest-market-data.json; then
            echo "Market snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-market-data.json
          git commit -m "Update market data"
          git push
